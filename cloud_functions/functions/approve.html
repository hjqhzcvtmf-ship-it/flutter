<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approve TEK Applications</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #000;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #00FF41;
            margin-bottom: 30px;
            text-align: center;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #888;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
        }
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .approve-btn {
            background: #00FF41;
            color: #000;
        }
        .approve-btn:hover {
            background: #00CC34;
        }
        .reject-btn {
            background: #FF0000;
            color: #fff;
        }
        .reject-btn:hover {
            background: #CC0000;
        }
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .message.success {
            background: #00FF4120;
            border: 1px solid #00FF41;
            color: #00FF41;
        }
        .message.error {
            background: #FF000020;
            border: 1px solid #FF0000;
            color: #FF0000;
        }
        .loading {
            text-align: center;
            color: #888;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Approve TEK Applications</h1>
        
        <div class="input-group">
            <label for="appId">Application ID</label>
            <input type="text" id="appId" placeholder="Enter the application ID from email">
        </div>

        <div class="button-group">
            <button class="approve-btn" onclick="handleAction('approve')">✓ APPROVE</button>
            <button class="reject-btn" onclick="handleAction('reject')">✗ REJECT</button>
        </div>

        <div id="message" class="message"></div>
        <div id="loading" class="loading" style="display: none;">Processing...</div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js';

        // Your Firebase configuration (from firebase_options.dart)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY_HERE",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const functions = getFunctions(app, 'us-central1');

        window.handleAction = async function(action) {
            const appId = document.getElementById('appId').value.trim();
            const messageDiv = document.getElementById('message');
            const loadingDiv = document.getElementById('loading');

            if (!appId) {
                showMessage('Please enter an application ID', 'error');
                return;
            }

            try {
                messageDiv.style.display = 'none';
                loadingDiv.style.display = 'block';

                const approveApplication = httpsCallable(functions, 'approveApplication');
                const result = await approveApplication({ appId, action });

                loadingDiv.style.display = 'none';
                
                if (result.data.success) {
                    showMessage(
                        action === 'approve' 
                            ? `✓ Application approved! Referral code: ${result.data.referralCode}`
                            : '✗ Application rejected',
                        'success'
                    );
                    document.getElementById('appId').value = '';
                }
            } catch (error) {
                loadingDiv.style.display = 'none';
                showMessage(`Error: ${error.message}`, 'error');
            }
        };

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }
    </script>
</body>
</html>
